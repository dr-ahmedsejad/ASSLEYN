# ═══════════════════════════════════════════════════════════════════
# Nginx — ASSLEYN, variante EN CLAIR (sans TLS)
#
# Choisie dans le .env :  ASLEYN_NGINX_CONF=./nginx.http.conf
#
# ⚠ Ce que cela signifie, sans detour
# ------------------------------------------------------------------
# Les mots de passe et les cookies de session circulent **lisibles** entre le
# telephone d'une etudiante et ce serveur. Quiconque se trouve sur le trajet —
# un operateur, un point d'acces Wi-Fi partage, un voisin de reseau — peut lire
# un mot de passe et se faire passer pour son titulaire. Aucun reglage de cette
# pile ne corrige cela : seul le chiffrement du transport le peut.
#
# Cette variante n'a donc qu'un usage : un serveur joint par son adresse IP,
# pour lequel aucune autorite ne delivre de certificat, et ou l'on accepte
# sciemment ce risque.
#
# La sortie de secours coute une commande :
#     ./deploy.sh setup-lan <IP>      puis  ASLEYN_NGINX_CONF=./nginx.lan.conf
# Le certificat est auto-signe — le navigateur previent une fois par appareil,
# et le trafic est chiffre ensuite.
#
# Deux reglages jumeaux doivent accompagner ce fichier, sinon personne ne
# reste connecte : DJANGO_HTTPS=False et COOKIES_SECURE=false. Un cookie
# marque `Secure` n'est pas envoye sur une page en clair.
#
# `server_name _` : repond a n'importe quel Host, une IP n'ayant pas de nom.
# ═══════════════════════════════════════════════════════════════════

upstream backend_upstream  { server backend:8010; }
upstream frontend_upstream { server frontend:3000; }

server_tokens off;

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Pas de HSTS : il ne vaut qu'en HTTPS, et un navigateur qui l'aurait
    # retenu refuserait ensuite toute connexion en clair — y compris apres un
    # retour en arriere.

    # ─── Relais BFF du serveur Next ────────────────────────────────
    # Le prefixe trompe : cette route appartient a Next, pas a Django. Le
    # navigateur y poste ses ecritures et le serveur Next les relaie vers
    # l'API en y rattachant la session. Sans ce bloc, `/api/` la capturerait
    # et Django repondrait 404 en HTML : l'interface, ne pouvant y lire de
    # JSON, afficherait son message de repli au lieu de l'erreur reelle.
    # Nginx retient le prefixe le plus long — ce bloc l'emporte sur `/api/`.
    location /api/bff/ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, et non $proxy_add_x_forwarded_for : ce dernier AJOUTE
        # l'adresse observee a celle que le client a bien voulu declarer.
        # Django lisant la premiere valeur de la liste, n'importe qui
        # pourrait alors choisir l'adresse inscrite au journal.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ─── API Django ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, et non $proxy_add_x_forwarded_for : ce dernier AJOUTE
        # l'adresse observee a celle que le client a bien voulu declarer.
        # Django lisant la premiere valeur de la liste, n'importe qui
        # pourrait alors choisir l'adresse inscrite au journal.
        proxy_set_header X-Forwarded-For   $remote_addr;
        # `$scheme` vaut « http » ici. Django s'y fie pour savoir s'il doit
        # rediriger : c'est ce qui evite une boucle de redirection.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ─── Administration Django ─────────────────────────────────────
    location /admin/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, et non $proxy_add_x_forwarded_for : ce dernier AJOUTE
        # l'adresse observee a celle que le client a bien voulu declarer.
        # Django lisant la premiere valeur de la liste, n'importe qui
        # pourrait alors choisir l'adresse inscrite au journal.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Fichiers statiques de Django (administration) ─────────────
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Sonde ─────────────────────────────────────────────────────
    location = /healthz/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ─── Application Next.js ───────────────────────────────────────
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, et non $proxy_add_x_forwarded_for : ce dernier AJOUTE
        # l'adresse observee a celle que le client a bien voulu declarer.
        # Django lisant la premiere valeur de la liste, n'importe qui
        # pourrait alors choisir l'adresse inscrite au journal.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
