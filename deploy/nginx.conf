# ═══════════════════════════════════════════════════════════════════
# Nginx — ASSLEYN, variante domaine public (Let's Encrypt)
#
# Variante par defaut. Pour un serveur sur reseau local, poser dans le .env :
#   ASLEYN_NGINX_CONF=./nginx.lan.conf
#
# ${ASLEYN_DOMAIN} est remplace au demarrage du conteneur par l'image nginx
# elle-meme (envsubst sur les fichiers de /etc/nginx/templates). Le filtre
# NGINX_ENVSUBST_FILTER=ASLEYN_ garantit que seules les variables de ce
# prefixe sont substituees : $host, $scheme et $http_host restent des
# variables Nginx, evaluees a chaque requete. Ce fichier n'est donc jamais
# reecrit sur le disque — un `git pull` ne le remet pas en cause.
#
# Le certificat est emis sur l'HOTE, avant le premier demarrage :
#   docker compose stop nginx
#   certbot certonly --standalone -d resultats.example.mr
#   docker compose start nginx
# Le renouvellement, lui, passe par le webroot ci-dessous, sans interruption.
#
# Pas de `sub_filter` ici, contrairement a SIGA : le navigateur n'appelle
# jamais Django, il n'y a donc aucune adresse a reecrire dans le JavaScript
# livre.
# ═══════════════════════════════════════════════════════════════════

upstream backend_upstream  { server backend:8010; }
upstream frontend_upstream { server frontend:3000; }

server_tokens off;

# ─── HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    server_name ${ASLEYN_DOMAIN};

    # Le renouvellement du certificat ne doit pas etre redirige.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # $http_host, et non $host : il conserve le port. Sur un port autre
    # que 443 — un serveur qui heberge deja une autre application — une
    # redirection vers $host renverrait le visiteur vers un port ferme.
    location / { return 301 https://$http_host$request_uri; }
}

# ─── HTTPS ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name ${ASLEYN_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${ASLEYN_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${ASLEYN_DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # HSTS est pose ici, et ici seulement. Django le poserait aussi
    # (SECURE_HSTS_SECONDS), mais seules les reponses de l'API en
    # beneficieraient : les pages sortent du conteneur frontend.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP, X-Frame-Options et consorts sont poses par les applications
    # elles-memes (django-csp cote API, Next cote pages) : les redoubler ici
    # produirait deux en-tetes concurrents.

    # ─── Relais BFF du serveur Next ────────────────────────────────
    # Le prefixe trompe : cette route appartient a Next, pas a Django. Le
    # navigateur y poste ses ecritures et le serveur Next les relaie vers
    # l'API en y rattachant la session. Sans ce bloc, `/api/` la capturerait
    # et Django repondrait 404 en HTML : l'interface, ne pouvant y lire de
    # JSON, afficherait son message de repli au lieu de l'erreur reelle.
    # Nginx retient le prefixe le plus long — ce bloc l'emporte sur `/api/`.
    location /api/bff/ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, et non $proxy_add_x_forwarded_for : ce dernier AJOUTE
        # l'adresse observee a celle que le client a bien voulu declarer.
        # Django lisant la premiere valeur de la liste, n'importe qui
        # pourrait alors choisir l'adresse inscrite au journal.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ─── API Django ────────────────────────────────────────────────
    # Le navigateur ne s'en sert pas — le serveur Next appelle Django par le
    # reseau interne. La route reste exposee pour l'outillage : schema
    # OpenAPI, sondes, integrations futures.
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, et non $proxy_add_x_forwarded_for : ce dernier AJOUTE
        # l'adresse observee a celle que le client a bien voulu declarer.
        # Django lisant la premiere valeur de la liste, n'importe qui
        # pourrait alors choisir l'adresse inscrite au journal.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ─── Administration Django ─────────────────────────────────────
    location /admin/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, et non $proxy_add_x_forwarded_for : ce dernier AJOUTE
        # l'adresse observee a celle que le client a bien voulu declarer.
        # Django lisant la premiere valeur de la liste, n'importe qui
        # pourrait alors choisir l'adresse inscrite au journal.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Fichiers statiques de Django (administration) ─────────────
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Sonde ─────────────────────────────────────────────────────
    # Utile a un moniteur externe. Elle ne revele rien : « ok » ou « degraded ».
    location = /healthz/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ─── Application Next.js ───────────────────────────────────────
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, et non $proxy_add_x_forwarded_for : ce dernier AJOUTE
        # l'adresse observee a celle que le client a bien voulu declarer.
        # Django lisant la premiere valeur de la liste, n'importe qui
        # pourrait alors choisir l'adresse inscrite au journal.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
