# ═══════════════════════════════════════════════════════════════════
# Nginx — ASSLEYN, variante reseau local (certificat auto-signe)
#
# Choisie dans le .env :  ASLEYN_NGINX_CONF=./nginx.lan.conf
# Le certificat est produit par `bash deploy.sh setup-lan <IP>`.
#
# Sert exactement la meme application que nginx.conf, a trois nuances pres :
#
#   - server_name _  : repond a n'importe quel Host. Un institut sur reseau
#     local est joint tantot par son IP, tantot par un nom de machine.
#   - pas de HSTS : un HSTS pose avec un certificat auto-signe verrouillerait
#     durablement le navigateur sur un certificat qu'il refuse.
#   - pas de webroot ACME : aucune autorite ne viendra valider ce domaine.
#
# HTTPS reste indispensable meme en local : la session de Django est marquee
# Secure (SESSION_COOKIE_SECURE), et un navigateur ne renvoie pas un cookie
# Secure sur une page en clair. En HTTP simple, personne ne resterait connecte.
# ═══════════════════════════════════════════════════════════════════

upstream backend_upstream  { server backend:8010; }
upstream frontend_upstream { server frontend:3000; }

server_tokens off;

# ─── HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    # $http_host, et non $host : il conserve le port. Sur un port autre
    # que 443 — un serveur qui heberge deja une autre application — une
    # redirection vers $host renverrait le visiteur vers un port ferme.
    location / { return 301 https://$http_host$request_uri; }
}

# ─── HTTPS ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ─── Relais BFF du serveur Next ────────────────────────────────
    # Le prefixe trompe : cette route appartient a Next, pas a Django. Le
    # navigateur y poste ses ecritures et le serveur Next les relaie vers
    # l'API en y rattachant la session. Sans ce bloc, `/api/` la capturerait
    # et Django repondrait 404 en HTML : l'interface, ne pouvant y lire de
    # JSON, afficherait son message de repli au lieu de l'erreur reelle.
    # Nginx retient le prefixe le plus long — ce bloc l'emporte sur `/api/`.
    location /api/bff/ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, et non $proxy_add_x_forwarded_for : ce dernier AJOUTE
        # l'adresse observee a celle que le client a bien voulu declarer.
        # Django lisant la premiere valeur de la liste, n'importe qui
        # pourrait alors choisir l'adresse inscrite au journal.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, et non $proxy_add_x_forwarded_for : ce dernier AJOUTE
        # l'adresse observee a celle que le client a bien voulu declarer.
        # Django lisant la premiere valeur de la liste, n'importe qui
        # pourrait alors choisir l'adresse inscrite au journal.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, et non $proxy_add_x_forwarded_for : ce dernier AJOUTE
        # l'adresse observee a celle que le client a bien voulu declarer.
        # Django lisant la premiere valeur de la liste, n'importe qui
        # pourrait alors choisir l'adresse inscrite au journal.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, et non $proxy_add_x_forwarded_for : ce dernier AJOUTE
        # l'adresse observee a celle que le client a bien voulu declarer.
        # Django lisant la premiere valeur de la liste, n'importe qui
        # pourrait alors choisir l'adresse inscrite au journal.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
